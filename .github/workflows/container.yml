name: Test and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Show runtime version
        run: node --version

      # 项目零第三方依赖：没有 npm install 步骤需要执行。
      - name: Run tests
        run: npm test

      - name: Verify legal notices are present
        run: |
          test -f LICENSE || (echo "缺少 LICENSE" && exit 1)
          test -f NOTICE  || (echo "缺少 NOTICE"  && exit 1)
          test -f licenses/Apache-2.0.txt || (echo "缺少 Apache-2.0 全文" && exit 1)

  build-and-push:
    name: Build and push image
    needs: test
    # 只在 main 分支与版本标签上构建镜像；PR 只跑测试。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wudao:smoke
          cache-to: type=gha,mode=max
          cache-from: type=gha

      - name: Verify dance container and pose assets
        run: |
          docker run -d --name wudao-smoke -p 8787:8787 wudao:smoke
          trap 'docker logs wudao-smoke; docker rm -f wudao-smoke' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/api/health; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8787/wujing | grep -q '舞镜智练'
          curl -fsS http://localhost:8787/ | grep -q '舞镜智练'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/index.html)" = 302
          docker exec wudao-smoke node scripts/setup-pose-assets.mjs --verify-only

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
